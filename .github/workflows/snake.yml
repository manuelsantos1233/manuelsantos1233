name: Generate Animation

on:
  # Executa automaticamente a cada 24 horas (ou nos pushes)
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
- push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 1. Obter o repositório
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Gerar a animação do Snake
      - name: Generate Snake Animation
        uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: manuelsantos1233
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      # 3. Enviar para a branch de output (onde o crazy-max é atualizado)
      - name: Push Snake to Output Branch
        uses: crazy-max/ghaction-github-pages@v4 # <-- Atualizado de v3 para v4 (ou superior)
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
